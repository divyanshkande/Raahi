server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router - always fall back to index.html so client-side routes
    # like /plan and /auth work on a hard refresh or direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively; index.html itself is not cached.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
