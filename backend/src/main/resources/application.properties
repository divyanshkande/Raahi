spring.application.name=aitourplanner

# --- Server ---
# Most PaaS providers (Render, Railway, etc.) inject $PORT at runtime.
server.port=${PORT:8080}

# --- Database ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# ddl-auto=validate ensures schema matches entities exactly.
# Schema is managed by Flyway migrations (src/main/resources/db/migration).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=1

# --- OpenRouter (AI itinerary generation) ---
# Kept for backward compatibility / fallback path.
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.prompt=${OPENROUTER_PROMPT}
openrouter.model.name=${OPENROUTER_MODEL_NAME}

# --- AI Prompt Configuration ---
# The example JSON in the prompt uses realistic example coordinates (not 0,0)
# to avoid confusing the model into using (0,0) or city-center as fallbacks.
# Example coordinates below are for Paris landmarks.
openrouter.prompt.example.lat=48.8584
openrouter.prompt.example.lng=2.2945

# --- Spring AI ---
# OpenRouter exposes an OpenAI-compatible API, so we point Spring AI's
# OpenAI client at it instead of api.openai.com. SpringAiConfig builds the
# OpenAiApi/ChatModel/ChatClient beans explicitly (to attach OpenRouter's
# attribution headers), which take precedence over Spring AI's own
# auto-configured beans.
spring.ai.openai.api-key=${OPENROUTER_API_KEY}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.model=${OPENROUTER_MODEL_NAME}
spring.ai.openai.chat.options.temperature=0.7
# Timeout configuration (milliseconds) - Spring AI 1.0.0 uses these properties
spring.ai.openai.client.connect-timeout=30000
spring.ai.openai.client.read-timeout=120000

# --- Caching (Caffeine) ---
# Caches identical (city + days + interests) itinerary requests to avoid
# repeated AI calls. Entries expire after 6 hours and are capped in size.
spring.cache.type=caffeine
spring.cache.cache-names=itineraries
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=6h

# --- Auth / JWT ---
# jwt.secret MUST be a long random string in production (32+ chars).
# Generate one with: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration.ms=${JWT_EXPIRATION_MS:86400000}

# --- CORS ---
# Comma-separated list of origins allowed to call this API.
# Add your deployed frontend URL here once you have it, e.g.:
# CORS_ALLOWED_ORIGINS=http://localhost:3000,https://raahi.vercel.app
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- AI Rate Limiting ---
# Maximum AI requests per minute per authenticated user
app.rate-limit.ai.requests-per-minute=10
# Rate limit window in minutes
app.rate-limit.ai.window-minutes=1

# --- Request Size Limits ---
# Maximum request body size for multipart/form-data (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Maximum HTTP header size (8KB)
server.max-http-header-size=8KB
# Maximum request body size for non-multipart requests (Tomcat)
server.tomcat.max-http-post-size=10MB